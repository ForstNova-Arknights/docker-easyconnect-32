version: '2'
services:
    easyconnect:
        image: hagb/docker-easyconnect:7.6.7 # latest, vncless, 7.6.3, vncless-7.6.3, 7.6.7, vncless-7.6.7
        devices:
          - /dev/net/tun
        cap_add: 
          - NET_ADMIN
        # EasyConnect 会 mlock() 内存，而容器默认的 RLIMIT_MEMLOCK 只有 64 KiB，
        # mlock 会以 ENOMEM 失败、登录失败（部分设备才触发）。放开这一项即可，
        # 不必用 privileged。详见 README 的「部分设备需要放开 memlock」。
        ulimits:
          memlock: -1
        volumes:
          - $HOME/.ecdata:/root
        environment:
          - URLWIN=1
          - PASSWORD=xxxx
        ports:
          - "127.0.0.1:5901:5901"
          - "127.0.0.1:1080:1080"
          - "127.0.0.1:8888:8888"
