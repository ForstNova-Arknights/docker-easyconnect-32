name: Build armhf CLI image

# Cross-compiles the patched qemu-user emulator, verifies that it forwards
# getsockopt(fd, SOL_IP, SO_ORIGINAL_DST, ...), and publishes the armhf CLI
# image to GitHub Container Registry.
#
# Published image tags:
#   ghcr.io/<owner>/<repo>:cli-<host-arch>   e.g. :cli-armhf
#   ghcr.io/<owner>/<repo>:master
#   ghcr.io/<owner>/<repo>:sha-<commit>
#   ghcr.io/<owner>/<repo>:<tag>             on tag pushes

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      qemu_host_arch:
        description: Architecture the image runs on (Debian name)
        type: string
        default: armhf
      qemu_target_arch:
        description: Architecture the emulator emulates (QEMU name)
        type: string
        default: x86_64
      ec_host:
        description: Debian architecture of the EasyConnect binaries
        type: string
        default: amd64
      platform:
        description: Docker platform of the image
        type: string
        default: linux/arm/v7
      rebuild_emulator:
        description: Rebuild the emulator from source instead of using the committed binary
        type: boolean
        default: false
      push:
        description: Push the image to GHCR
        type: boolean
        default: true

env:
  QEMU_HOST_ARCH: ${{ github.event.inputs.qemu_host_arch || 'armhf' }}
  QEMU_TARGET_ARCH: ${{ github.event.inputs.qemu_target_arch || 'x86_64' }}
  EC_HOST: ${{ github.event.inputs.ec_host || 'amd64' }}
  PLATFORM: ${{ github.event.inputs.platform || 'linux/arm/v7' }}
  IMAGE: ghcr.io/${{ github.repository }}
  EMULATOR: qemu-user/qemu-${{ github.event.inputs.qemu_target_arch || 'x86_64' }}-${{ github.event.inputs.qemu_host_arch || 'armhf' }}

jobs:
  # ---------------------------------------------------------------------------
  # Cross-compile the emulator.  Skipped unless asked for, so that ordinary
  # pushes reuse the binary committed under qemu-user/ and stay fast.
  # ---------------------------------------------------------------------------
  emulator:
    name: Cross-compile qemu-user
    if: ${{ github.event.inputs.rebuild_emulator == 'true' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: sudo ./qemu-user/build.sh "$QEMU_HOST_ARCH" "$QEMU_TARGET_ARCH"

      - name: Report the result
        run: |
          ls -l "$EMULATOR"
          file "$EMULATOR"
          sha256sum "$EMULATOR"

      - name: Upload the emulator
        uses: actions/upload-artifact@v4
        with:
          name: qemu-${{ env.QEMU_TARGET_ARCH }}-${{ env.QEMU_HOST_ARCH }}
          path: ${{ env.EMULATOR }}
          if-no-files-found: error

      - name: Attach the emulator to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "$EMULATOR" --clobber

  # ---------------------------------------------------------------------------
  # Prove that the emulator forwards SO_ORIGINAL_DST instead of answering
  # ENOPROTOOPT.  The distribution's qemu-arm has the same unpatched
  # do_getsockopt() as upstream QEMU, so a *patched* native qemu-arm has to be
  # built as well: it is the outer emulator that runs the armhf binary on an
  # x86-64 runner, and an unpatched one would mask the fix.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify SO_ORIGINAL_DST forwarding
    needs: [emulator]
    if: ${{ always() && !cancelled() && needs.emulator.result != 'failure' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Use the freshly built emulator
        if: ${{ needs.emulator.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: qemu-${{ env.QEMU_TARGET_ARCH }}-${{ env.QEMU_HOST_ARCH }}
          path: qemu-user

      - name: Install the test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iptables iproute2 qemu-user-static

      # Two patched emulators are needed here: qemu-arm is the outer emulator
      # that runs the armhf binary on an x86-64 runner (the distribution's own
      # qemu-arm has the same unpatched do_getsockopt() and would mask the fix),
      # and qemu-x86_64 drives case 2.  Both share one build tree, so the QEMU
      # tarball is only downloaded once.
      - name: Build patched native emulators
        run: |
          sudo ./qemu-user/build.sh amd64 arm
          sudo ./qemu-user/build.sh amd64 x86_64

      - name: Run the verification
        run: |
          mkdir -p /tmp/native
          cp qemu-user/qemu-arm-amd64 /tmp/native/qemu-arm
          cp qemu-user/qemu-x86_64-amd64 /tmp/native/qemu-x86_64
          sudo env NATIVE_DIR=/tmp/native ARMHF_QEMU="$PWD/$EMULATOR" \
               ./qemu-user/test/run_verify.sh

  # ---------------------------------------------------------------------------
  # Build the image and publish it.
  # ---------------------------------------------------------------------------
  image:
    name: Build and push the image
    needs: [emulator]
    if: ${{ always() && !cancelled() && needs.emulator.result != 'failure' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Use the freshly built emulator
        if: ${{ needs.emulator.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: qemu-${{ env.QEMU_TARGET_ARCH }}-${{ env.QEMU_HOST_ARCH }}
          path: qemu-user

      - name: Fetch the EasyConnect packages
        # Straight from github.com / sangfor; the gh-proxy mirror is only for
        # networks where github.com is slow.
        env:
          GH_PROXY: ''
        run: ./local-deps/fetch.sh

      - name: Set up QEMU (to run linux/arm/v7 containers)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push == 'true') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=cli-${{ env.QEMU_HOST_ARCH }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cli-armhf
          platforms: ${{ env.PLATFORM }}
          push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push == 'true') }}
          build-args: |
            QEMU_HOST_ARCH=${{ env.QEMU_HOST_ARCH }}
            QEMU_TARGET_ARCH=${{ env.QEMU_TARGET_ARCH }}
            EC_HOST=${{ env.EC_HOST }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
